name: Bug report
description: Something in Zyvek does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Zyvek. Please do not include passwords, tokens or personal data.
  - type: input
    id: version
    attributes:
      label: Zyvek version
      description: Settings › About Zyvek
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Press …
        3. …
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - First start
        - Playback
        - Home and menu
        - Search
        - Profiles
        - Plex connection
        - Philips Hue
        - Notifications
        - Updates
        - Settings
        - Other
  - type: textarea
    id: hardware
    attributes:
      label: Display, TV / soundbar and remote
      description: Useful for playback, HDR and audio issues.
  - type: textarea
    id: logs
    attributes:
      label: Diagnostics
      description: Settings › About › Diagnostics lets you save logs. Attach the file here.
